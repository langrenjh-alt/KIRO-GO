<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro-Go</title>
  <link rel="icon" type="image/x-icon" href="/admin/favicon.ico" />
  <script src="/admin/vendor/tailwindcss-browser/index.global.js"></script>
  <link rel="stylesheet" href="/admin/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="/admin/styles.css" id="__cssAsset" />
  <link rel="stylesheet" href="/admin/toast.css" id="__toastCss" />
  <style>
    .traffic-toolbar,
    .traffic-chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .traffic-heading {
      min-width: 0;
    }
    .traffic-title {
      margin: 0;
      color: var(--foreground);
      font-size: 1.125rem;
      font-weight: 650;
      letter-spacing: 0;
    }
    .traffic-range {
      display: inline-grid;
      grid-template-columns: repeat(3, minmax(3.25rem, 1fr));
      padding: 0.1875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--muted);
    }
    .traffic-range-btn {
      height: 2rem;
      padding: 0 0.75rem;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted-foreground);
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0;
      cursor: pointer;
    }
    .traffic-range-btn:hover {
      color: var(--foreground);
    }
    .traffic-range-btn.active {
      background: var(--card);
      color: var(--foreground);
      box-shadow: 0 0 0 1px var(--border);
    }
    .traffic-range-btn:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 1px;
    }
    .traffic-summary-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .traffic-summary-item {
      min-width: 0;
      padding: 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--card);
      box-shadow: inset 3px 0 0 var(--series-color, var(--border));
    }
    .traffic-summary-label {
      display: block;
      color: var(--muted-foreground);
      font-size: 0.75rem;
      line-height: 1.3;
      letter-spacing: 0;
    }
    .traffic-summary-value {
      display: block;
      margin-top: 0.375rem;
      color: var(--foreground);
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .traffic-chart-panel {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--card);
    }
    .traffic-chart-title {
      color: var(--foreground);
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0;
    }
    .traffic-chart-meta {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      color: var(--muted-foreground);
      font-size: 0.75rem;
    }
    .traffic-legend {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin-top: 0.875rem;
      flex-wrap: wrap;
      color: var(--muted-foreground);
      font-size: 0.75rem;
    }
    .traffic-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      white-space: nowrap;
    }
    .traffic-legend-swatch {
      width: 0.625rem;
      height: 0.625rem;
      border-radius: 2px;
      background: var(--series-color);
      flex: none;
    }
    .traffic-legend-swatch--rate {
      width: 0.875rem;
      height: 0;
      border-radius: 0;
      border-top: 2px dashed var(--series-color);
      background: transparent;
    }
    .traffic-chart-stage {
      position: relative;
      width: 100%;
      height: 22rem;
      margin-top: 0.75rem;
      overflow: hidden;
    }
    .traffic-chart-stage canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .traffic-chart-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: color-mix(in srgb, var(--card) 88%, transparent);
      color: var(--muted-foreground);
      font-size: 0.8125rem;
      text-align: center;
    }
    .traffic-tooltip {
      position: absolute;
      z-index: 2;
      min-width: 11rem;
      max-width: min(17rem, calc(100% - 1rem));
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--popover);
      color: var(--popover-foreground);
      box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.12);
      pointer-events: none;
      font-size: 0.75rem;
    }
    .traffic-tooltip-time {
      margin-bottom: 0.375rem;
      font-weight: 600;
    }
    .traffic-tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      line-height: 1.55;
    }
    .traffic-tooltip-label {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      color: var(--muted-foreground);
    }
    .traffic-tooltip-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--series-color);
    }
    @media (max-width: 960px) {
      .traffic-summary-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 720px) {
      #tabBar.tabs {
        width: 100%;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0.25rem;
      }
      #tabBar .tab {
        min-width: 0;
        padding-inline: 0.125rem;
        font-size: 0.6875rem;
      }
      .traffic-toolbar {
        align-items: stretch;
      }
      .traffic-range {
        width: 100%;
      }
      .traffic-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .traffic-chart-stage {
        height: 17.5rem;
      }
      .traffic-chart-meta {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
  <script>
    (function () {
      var v = Date.now();
      window.__v = v;
      var css = document.getElementById('__cssAsset');
      if (css) css.href = '/admin/styles.css?v=' + v;
      var tcss = document.getElementById('__toastCss');
      if (tcss) tcss.href = '/admin/toast.css?v=' + v;
    })();
  </script>
</head>

<body>
  <!-- Login -->
  <div id="loginPage" class="login-wrapper">
    <div class="ghost-bg" aria-hidden="true">
      <i class="fa-solid fa-ghost ghost ghost-1"></i>
      <i class="fa-solid fa-ghost ghost ghost-2"></i>
      <i class="fa-solid fa-ghost ghost ghost-3"></i>
      <i class="fa-solid fa-ghost ghost ghost-4"></i>
      <i class="fa-solid fa-ghost ghost ghost-5"></i>
      <i class="fa-solid fa-ghost ghost ghost-6"></i>
      <i class="fa-solid fa-ghost ghost ghost-7"></i>
      <i class="fa-solid fa-ghost ghost ghost-8"></i>
      <i class="fa-solid fa-ghost ghost ghost-9"></i>
      <i class="fa-solid fa-ghost ghost ghost-10"></i>
      <i class="fa-solid fa-ghost ghost ghost-11"></i>
      <i class="fa-solid fa-ghost ghost ghost-12"></i>
    </div>
    <header class="login-topbar">
      <div class="login-topbar-inner">
        <div class="brand" aria-label="Kiro-Go" data-i18n-aria-label="app.title">
          <img class="brand-icon" src="/admin/favicon.ico" alt="" />
          <span class="brand-text">Kiro-Go</span>
        </div>
        <div class="topbar-actions">
          <div class="lang-switch" id="loginLangSwitch" role="group" aria-label="" data-i18n-aria-label="lang.label">
            <button class="lang-btn" data-lang="zh" type="button" data-i18n="lang.zh"></button>
            <button class="lang-btn" data-lang="en" type="button" data-i18n="lang.en"></button>
          </div>
          <span class="divider" aria-hidden="true"></span>
          <button id="loginThemeToggle" class="icon-btn theme-toggle" type="button" aria-label=""
            data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle" data-theme="system">
            <i class="fa-solid fa-circle-half-stroke theme-ico-system"></i>
            <i class="fa-solid fa-sun theme-ico-light"></i>
            <i class="fa-solid fa-moon theme-ico-dark"></i>
          </button>
        </div>
      </div>
    </header>
    <main class="login-main">
      <div class="login-box">
        <h1 class="login-title" data-i18n="login.title"></h1>
        <p class="login-subtitle" data-i18n="login.subtitle"></p>
        <div class="form-group">
          <label data-i18n="login.password"></label>
          <div class="input-affix">
            <i class="fa-solid fa-lock affix-icon"></i>
            <input type="password" id="pwdField" data-i18n-placeholder="login.passwordPlaceholder" autocomplete="off" />
            <button type="button" class="affix-btn" id="pwdToggle" aria-label=""
              data-i18n-aria-label="login.showPassword" data-shown="false">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <label class="remember-row" for="rememberPwd">
          <input type="checkbox" id="rememberPwd" />
          <span class="remember-box" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
          <span class="remember-label" data-i18n="login.remember"></span>
        </label>
        <button type="button" class="btn btn-primary btn-lg w-full" id="loginBtn">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span data-i18n="login.submit"></span>
        </button>

      </div>
    </main>
  </div>

  <!-- Main app -->
  <div id="mainPage" class="hidden">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand-wrap">
          <div class="brand">
            <img class="brand-icon" src="/admin/favicon.ico" alt="" />
            <span class="brand-text">Kiro-Go</span>
          </div>
        </div>
        <nav class="header-nav" aria-label="" data-i18n-aria-label="aria.sections">
          <div class="tabs" id="tabBar">
            <button type="button" class="tab active" data-tab="accounts"><i class="fa-solid fa-users tab-icon"></i><span
                data-i18n="tabs.accounts"></span></button>
            <button type="button" class="tab" data-tab="traffic"><i class="fa-solid fa-chart-line tab-icon"></i><span
                data-i18n="tabs.traffic"></span></button>
            <button type="button" class="tab" data-tab="settings"><i class="fa-solid fa-sliders tab-icon"></i><span
                data-i18n="tabs.settings"></span></button>
            <button type="button" class="tab" data-tab="api"><i class="fa-solid fa-plug tab-icon"></i><span
                data-i18n="tabs.api"></span></button>
            <button type="button" class="tab" data-tab="logs"><i class="fa-solid fa-list tab-icon"></i><span
                data-i18n="tabs.logs"></span></button>
          </div>
        </nav>
        <div class="topbar-actions flex-wrap justify-end">
          <div class="lang-switch" id="mainLangSwitch" role="group" aria-label="" data-i18n-aria-label="lang.label">
            <button class="lang-btn" data-lang="zh" type="button" data-i18n="lang.zh"></button>
            <button class="lang-btn" data-lang="en" type="button" data-i18n="lang.en"></button>
          </div>
          <button id="mainThemeToggle" class="icon-btn theme-toggle" type="button" aria-label=""
            data-i18n-title="theme.toggle" data-i18n-aria-label="theme.toggle" data-theme="system">
            <i class="fa-solid fa-circle-half-stroke theme-ico-system"></i>
            <i class="fa-solid fa-sun theme-ico-light"></i>
            <i class="fa-solid fa-moon theme-ico-dark"></i>
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button class="btn btn-outline btn-sm" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span data-i18n="common.logout"></span>
          </button>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- Stats summary -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-title" data-i18n="stats.accounts"></div>
          <div class="stat-body">
            <div class="stat-main">
              <div class="stat-value" id="statAccounts">0</div>
              <div class="stat-sub">
                <span class="stat-sub-sec"><span class="stat-value-sm" id="statCredits">0</span> <span
                    class="stat-label" data-i18n="stats.credits"></span></span>
              </div>
            </div>
            <i class="fa-solid fa-users stat-icon" aria-hidden="true"></i>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title" data-i18n="stats.requests"></div>
          <div class="stat-body">
            <div class="stat-main">
              <div class="stat-value" id="statRequests">0</div>
              <div class="stat-sub">
                <span class="stat-sub-sec"><span class="stat-value-sm" id="statTokens">0</span> <span class="stat-label"
                    data-i18n="stats.tokens"></span></span>
              </div>
            </div>
            <i class="fa-solid fa-route stat-icon" aria-hidden="true"></i>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title" data-i18n="stats.success"></div>
          <div class="stat-body">
            <div class="stat-main">
              <div class="stat-value" id="statSuccess">0</div>
              <div class="stat-sub"><span class="stat-label" data-i18n="stats.completed"></span></div>
            </div>
            <i class="fa-solid fa-circle-check stat-icon" aria-hidden="true"></i>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-title" data-i18n="stats.failed"></div>
          <div class="stat-body">
            <div class="stat-main">
              <div class="stat-value stat-value--danger" id="statFailed">0</div>
              <div class="stat-sub">
                <span class="stat-label" data-i18n="stats.errors"></span>
              </div>
            </div>
            <i class="fa-solid fa-circle-xmark stat-icon stat-icon--danger" aria-hidden="true"></i>
          </div>
        </div>
      </div>

      <!-- Accounts tab -->
      <div id="tabAccounts" class="tab-content">
        <div class="card">
          <div class="card-header">
            <span class="card-title" data-i18n="accounts.title"></span>
            <div class="card-actions">
              <label class="flex items-center gap-2 cursor-pointer select-none" title=""
                data-i18n-title="privacy.tooltip">
                <span class="text-xs font-medium" data-i18n="privacy.label"></span>
                <span class="switch"><input type="checkbox" id="privacyModeToggle" checked /><span
                    class="slider"></span></span>
              </label>
              <button class="btn btn-outline btn-sm" id="exportBtn"><i class="fa-solid fa-file-export"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="accounts.export"></span></button>
              <button class="btn btn-outline btn-sm" id="refreshAllModelsBtn"><i class="fa-solid fa-arrows-rotate"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="models.refreshAll"></span></button>
              <button class="btn btn-primary btn-sm" id="addAccountBtn"><i class="fa-solid fa-plus"
                  aria-hidden="true"></i><span class="btn-text" data-i18n="accounts.add"></span></button>
            </div>
          </div>

          <div class="toolbar">
            <label class="flex items-center gap-1.5 cursor-pointer select-none shrink-0">
              <input type="checkbox" id="selectAllCheckbox" />
              <span class="text-xs" data-i18n="batch.selectAll"></span>
            </label>
            <div id="batchBar" class="batch-bar hidden">
              <span id="batchCount" class="batch-count"></span>
              <button class="btn btn-primary btn-xs" data-batch="enable" data-i18n="batch.enable"></button>
              <button class="btn btn-secondary btn-xs" data-batch="disable" data-i18n="batch.disable"></button>
              <button class="btn btn-secondary btn-xs" data-batch="refresh" data-i18n="batch.refresh"></button>
              <button class="btn btn-secondary btn-xs" data-batch="refreshModels"
                data-i18n="batch.refreshModels"></button>
              <button class="btn btn-danger btn-xs" data-batch="delete" data-i18n="batch.delete"></button>
            </div>
            <div class="toolbar-spacer"></div>
            <input type="text" id="filterSearch" class="w-56!" data-i18n-placeholder="filter.search" />
            <select id="filterStatusSelect" class="w-32!" data-i18n-aria-label="filter.status">
              <option value="all" data-i18n="filter.all"></option>
              <option value="enabled" data-i18n="filter.enabled"></option>
              <option value="disabled" data-i18n="filter.disabled"></option>
              <option value="banned" data-i18n="filter.banned"></option>
            </select>
          </div>

          <div id="accountsList"></div>
        </div>
      </div>

      <!-- Traffic tab -->
      <div id="tabTraffic" class="tab-content hidden">
        <div class="traffic-toolbar">
          <div class="traffic-heading">
            <h2 class="traffic-title" data-i18n="traffic.title"></h2>
          </div>
          <div class="traffic-range" id="trafficRange" role="group" aria-label="" data-i18n-aria-label="traffic.range">
            <button type="button" class="traffic-range-btn" data-traffic-range="1h" aria-pressed="false">1h</button>
            <button type="button" class="traffic-range-btn" data-traffic-range="6h" aria-pressed="false">6h</button>
            <button type="button" class="traffic-range-btn active" data-traffic-range="24h" aria-pressed="true">24h</button>
          </div>
        </div>

        <div class="traffic-summary-grid" aria-live="polite">
          <div class="traffic-summary-item" style="--series-color:#525252">
            <span class="traffic-summary-label" data-i18n="traffic.requests"></span>
            <strong class="traffic-summary-value" id="trafficTotalRequests">0</strong>
          </div>
          <div class="traffic-summary-item" style="--series-color:#0f766e">
            <span class="traffic-summary-label" data-i18n="traffic.totalTokens"></span>
            <strong class="traffic-summary-value" id="trafficTotalTokens">0</strong>
          </div>
          <div class="traffic-summary-item" style="--series-color:#2563eb">
            <span class="traffic-summary-label" data-i18n="traffic.inputTokens"></span>
            <strong class="traffic-summary-value" id="trafficInputTokens">0</strong>
          </div>
          <div class="traffic-summary-item" style="--series-color:#16a34a">
            <span class="traffic-summary-label" data-i18n="traffic.outputTokens"></span>
            <strong class="traffic-summary-value" id="trafficOutputTokens">0</strong>
          </div>
          <div class="traffic-summary-item" style="--series-color:#d97706">
            <span class="traffic-summary-label" data-i18n="traffic.cacheCreationTokens"></span>
            <strong class="traffic-summary-value" id="trafficCacheCreationTokens">0</strong>
          </div>
          <div class="traffic-summary-item" style="--series-color:#7c3aed">
            <span class="traffic-summary-label" data-i18n="traffic.cacheReadTokens"></span>
            <strong class="traffic-summary-value" id="trafficCacheReadTokens">0</strong>
          </div>
        </div>

        <section class="traffic-chart-panel" aria-labelledby="trafficChartTitle">
          <div class="traffic-chart-header">
            <span class="traffic-chart-title" id="trafficChartTitle" data-i18n="traffic.tokenTrend"></span>
            <div class="traffic-chart-meta">
              <span id="trafficUpdatedAt"></span>
              <button type="button" class="icon-btn" id="trafficRefreshBtn" aria-label="" title=""
                data-i18n-aria-label="traffic.refresh" data-i18n-title="traffic.refresh">
                <i class="fa-solid fa-rotate"></i>
              </button>
            </div>
          </div>
          <div class="traffic-legend" aria-hidden="true">
            <span class="traffic-legend-item"><span class="traffic-legend-swatch" style="--series-color:#2563eb"></span><span data-i18n="traffic.inputTokens"></span></span>
            <span class="traffic-legend-item"><span class="traffic-legend-swatch" style="--series-color:#16a34a"></span><span data-i18n="traffic.outputTokens"></span></span>
            <span class="traffic-legend-item"><span class="traffic-legend-swatch" style="--series-color:#d97706"></span><span data-i18n="traffic.cacheCreationTokens"></span></span>
            <span class="traffic-legend-item"><span class="traffic-legend-swatch" style="--series-color:#7c3aed"></span><span data-i18n="traffic.cacheReadTokens"></span></span>
            <span class="traffic-legend-item"><span class="traffic-legend-swatch traffic-legend-swatch--rate" style="--series-color:#db2777"></span><span data-i18n="traffic.cacheReadRate"></span></span>
          </div>
          <div class="traffic-chart-stage" id="trafficChartStage">
            <canvas id="trafficChart" role="img" aria-label="" data-i18n-aria-label="traffic.chartAria"></canvas>
            <div class="traffic-chart-state hidden" id="trafficChartState"></div>
            <div class="traffic-tooltip hidden" id="trafficTooltip"></div>
          </div>
        </section>
      </div>

      <!-- Settings tab -->
      <div id="tabSettings" class="tab-content hidden">
        <!-- API settings -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.apiSettings"></span></div>
          <div class="form-group">
            <label class="flex items-center gap-2">
              <span class="switch"><input type="checkbox" id="requireApiKey" /><span class="slider"></span></span>
              <span data-i18n="settings.enableApiKey"></span>
            </label>
            <small data-i18n="apiKeys.requireHint"></small>
          </div>
          <button class="btn btn-primary btn-sm" id="saveRequireApiKeyBtn" data-i18n="settings.saveApiKey"></button>

          <div class="form-group" style="margin-top: 1rem;">
            <div class="flex items-center gap-2" style="justify-content: space-between;">
              <label class="font-semibold" data-i18n="apiKeys.listTitle"></label>
              <button class="btn btn-outline btn-sm" id="addApiKeyBtn" type="button">
                <i class="fa-solid fa-plus"></i>
                <span data-i18n="apiKeys.add"></span>
              </button>
            </div>
            <small data-i18n="apiKeys.listHint"></small>
          </div>
          <div id="apiKeysList"></div>
        </div>

        <!-- Usage settings -->
        <div class="card">
          <div class="card-header"><span class="card-title" data-i18n="settings.usageSettings"></span></div>
          <div class="form-group">
            <label class="flex items-center gap-2">
              <span class="switch"><input type="checkbox" id="allowOverUsage" /><span class="slider"></span></span>
              <span data-i18n="settings.allowOverUsage"></span>
            </label>
            <small data-i18n="settings.allowOverUsageHint"></small>
          </div>
          <button class="btn btn-primary" id="saveOverUsageBtn" data-i18n="settings.saveUsage"></button>
        </div>

        <!-- Prompt cache settings -->
        <div class="card">
